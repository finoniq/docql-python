# The SDK contract kit check (CTR-02): pull the digest-pinned private docql-stub
# image with this repo's own GITHUB_TOKEN and prove that the kit it serves over HTTP
# equals the vendored copy in contract/ (D-07). Since Phase 11 the workflow also runs
# the full shared SDK case list and the README quickstart against the same pinned
# stub (contract-cases), and it is reusable so release.yml runs it on a tag.
name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  contract-access:
    name: contract-access
    # Fork PRs skip the job, so a fork never gets the private image through a PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: served kit equals vendored kit (D-07)
        run: scripts/bump-stub.sh --verify

  contract-cases:
    name: contract-cases
    # Same fork guard as contract-access: the pinned stub image is private.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: shared case list against the pinned stub
        run: scripts/stub-up.sh --run env DOCQL_REQUIRE_STUB=1 uv run --locked pytest -m contract -q -rA
      - name: README quickstart
        run: scripts/stub-up.sh --run uv run --locked python scripts/run_readme.py
