# The SDK contract kit check (CTR-02): pull the digest-pinned private docql-stub
# image with this repo's own GITHUB_TOKEN and prove that the kit it serves over HTTP
# equals the vendored copy in contract/ (D-07). Since Phase 11 the workflow also runs
# the full shared SDK case list and the README quickstart against the same pinned
# stub (contract-cases), and it is reusable so release.yml runs it on a tag.
name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  contract-access:
    name: contract-access
    # Fork PRs skip the job, so a fork never gets the private image through a PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: served kit equals vendored kit (D-07)
        run: scripts/bump-stub.sh --verify

  contract-cases:
    name: contract-cases
    # Same fork guard as contract-access: the pinned stub image is private.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: shared case list against the pinned stub
        # shell: bash adds pipefail, so the tee never hides a pytest failure.
        shell: bash
        run: scripts/stub-up.sh --run env DOCQL_REQUIRE_STUB=1 uv run --locked pytest -m contract -q -rA | tee "$RUNNER_TEMP/contract.log"
      - name: every stub job case ran and passed (JSDK-04 exact-count gate)
        # A silently skipped or deselected job case must fail the run: the PASSED
        # test_job_case lines must equal the kit's count of stub cases the SDK replays.
        shell: bash
        run: |
          WANT=$(jq '[.cases[] | select(.target == "stub" and (.via == "submit" or .via == "poll" or .via == "cancel" or .via == "wait"))] | length' contract/job-cases.json)
          ran=$(grep -cE '^PASSED tests/contract/test_job_cases\.py::test_job_case\[' "$RUNNER_TEMP/contract.log" || true)
          bad=$(grep -cE '^(FAILED|SKIPPED|ERROR)( \[[0-9]+\])? tests/contract/test_job_cases\.py' "$RUNNER_TEMP/contract.log" || true)
          echo "JOB_CASES_RAN $ran (want $WANT)"
          if [ "$bad" -ne 0 ]; then
            echo "test_job_cases.py has $bad FAILED/SKIPPED/ERROR lines" >&2
            exit 1
          fi
          if [ "$WANT" -eq 0 ] || [ "$ran" -ne "$WANT" ]; then
            echo "expected $WANT job-case PASSED lines, saw $ran" >&2
            exit 1
          fi
      - name: README quickstart
        run: scripts/stub-up.sh --run uv run --locked python scripts/run_readme.py
      - name: README jobs example
        run: scripts/stub-up.sh --run uv run --locked python scripts/run_readme.py --block jobs
